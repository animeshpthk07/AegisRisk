services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aegisrisk
      POSTGRES_DB: aegisrisk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U aegisrisk -d aegisrisk"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://aegisrisk:${POSTGRES_PASSWORD}@db:5432/aegisrisk
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, "alembic upgrade head && python -m aegisrisk.seed"]
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://aegisrisk:${POSTGRES_PASSWORD}@db:5432/aegisrisk
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
