worker_processes 1;
pid /tmp/aegisrisk-nginx/nginx.pid;
error_log stderr error;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/aegisrisk-nginx/body;
    proxy_temp_path /tmp/aegisrisk-nginx/proxy;
    fastcgi_temp_path /tmp/aegisrisk-nginx/fastcgi;
    uwsgi_temp_path /tmp/aegisrisk-nginx/uwsgi;
    scgi_temp_path /tmp/aegisrisk-nginx/scgi;
    client_max_body_size 512k;
    client_body_buffer_size 512k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 10s;
    # A single shared budget: never trust a client-supplied forwarding header.
    limit_req_zone $server_name zone=demo_rate:1m rate=10r/s;
    limit_conn_zone $server_name zone=demo_connections:1m;
    limit_req_status 429;
    limit_conn_status 429;
    server {
        listen __PORT__;
        server_name _;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
        error_page 413 = @too_large;
        error_page 429 = @busy;
        error_page 502 503 504 = @unavailable;
        # Checks the frontend, backend and seeded database through the web proxy.
        location = /healthz {
            proxy_pass http://127.0.0.1:3000/api/ready;
        }
        location /api/ {
            limit_req zone=demo_rate burst=40 nodelay;
            limit_conn demo_connections 8;
            proxy_pass http://127.0.0.1:3000;
        }
        location / {
            proxy_pass http://127.0.0.1:3000;
        }
        location @too_large {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            return 413 '{"detail":"Request exceeds the demo transport limit."}';
        }
        location @busy {
            default_type application/json;
            add_header Retry-After "5" always;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            return 429 '{"detail":"Demo is busy. Please retry in a few seconds."}';
        }
        location @unavailable {
            default_type application/json;
            add_header Retry-After "5" always;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            return 503 '{"detail":"Demo is starting or temporarily unavailable."}';
        }
    }
}
