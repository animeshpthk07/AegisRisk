name: AegisRisk verification
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aegisrisk
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: aegisrisk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegisrisk -d aegisrisk"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e './apps/api[dev]'
      - run: ruff check apps/api
      - run: pytest apps/api/tests -q
        env:
          AEGISRISK_PDF_EVIDENCE_DIR: test-results/pdf
      - name: Render synthetic PDF evidence for browser-only review
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          for report in test-results/pdf/*.pdf; do
            pdftoppm -r 90 -png "$report" "${report%.pdf}"
          done
          python -c "from pathlib import Path; from base64 import b64encode; [print('AEGISRISK_PDF_PREVIEW ' + p.name + ' data:image/png;base64,' + b64encode(p.read_bytes()).decode()) for p in sorted(Path('test-results/pdf').glob('*.png'))]"
      - name: Retain synthetic PDF review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pdf-review-evidence
          path: test-results/pdf/
          retention-days: 7
          if-no-files-found: warn
      - name: PostgreSQL migration and read-only smoke
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://aegisrisk:ci-only-password@localhost:5432/aegisrisk
        run: |
          alembic upgrade 0001
          python -m aegisrisk.seed
          alembic upgrade head
          python -c "from fastapi.testclient import TestClient; from aegisrisk.main import app; c=TestClient(app); assert c.get('/api/v1/ready').status_code == 200; assert c.get('/api/v1/portfolio').json()['summary']['facility_count'] == 40"
      - run: pip-audit --skip-editable
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod
  browser:
    name: Full-stack browser checks (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    # Slow package mirrors must not consume the application-test budget.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      AEGISRISK_BROWSER: ${{ matrix.browser }}
      DATABASE_URL: sqlite:////tmp/aegisrisk-browser.db
      API_BASE_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: '1'
      SYNTHETIC_IMPORTS_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pip install -e './apps/api[dev]' playwright==1.64.0
      - name: Install browser and OS dependencies
        timeout-minutes: 15
        run: python -m playwright install --with-deps "${{ matrix.browser }}"
      - run: ruff check --select E,F,I tests/browser tests/access
      - run: pnpm build
      - name: Prepare isolated fictional database
        working-directory: apps/api
        run: |
          alembic upgrade head
          python -m aegisrisk.seed
      - name: Verify real browser to proxy to API flow
        timeout-minutes: 6
        run: |
          mkdir -p test-results
          python -m uvicorn aegisrisk.main:app --host 127.0.0.1 --port 8000 > test-results/api.log 2>&1 &
          api_pid=$!
          pnpm --dir apps/web exec next start --hostname 127.0.0.1 --port 3000 > test-results/web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          python -m pytest tests/browser -q --junitxml=test-results/browser.xml
          python -m pytest tests/access -q --junitxml=test-results/access.xml
      - name: Show synthetic UI captures for browser-only review
        if: always()
        run: |
          python - <<'PY'
          from base64 import b64encode
          from pathlib import Path
          for width in (1440, 320):
              image = Path(
                  f"test-results/access-test_keyboard_unlock_reload_and_memory_only_token_{width}_.png"
              )
              if image.is_file() and image.stat().st_size <= 1_000_000:
                  encoded = b64encode(image.read_bytes()).decode("ascii")
                  print(f"AEGISRISK_ACCESS_PREVIEW {image.name} data:image/png;base64,{encoded}")
              for theme in ("dark", "light"):
                  image = Path(f"test-results/ui-review-{width}-{theme}.png")
                  if image.is_file() and image.stat().st_size <= 1_000_000:
                      encoded = b64encode(image.read_bytes()).decode("ascii")
                      print(f"AEGISRISK_UI_PREVIEW {image.name} data:image/png;base64,{encoded}")
          PY
      - name: Retain synthetic-only test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-check-evidence-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
  containers:
    name: PostgreSQL container lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Disposable test database only; never a deployment credential.
      POSTGRES_PASSWORD: ci-only-container-password
      COMPOSE_PROJECT_NAME: aegisrisk-container-ci
      COMPOSE_FILE: compose.yaml:tests/containers/compose.yaml
      AEGISRISK_CONTAINER_TEST: fictional-only
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e './apps/api[dev]' playwright==1.64.0
      - run: python -m playwright install --with-deps chromium
      - run: ruff check --select E,F,I tests/containers
      - name: Build the real API and standalone web images
        run: docker compose build --pull
      - name: Verify the safe default stack
        run: |
          docker compose -f compose.yaml up -d
          python tests/containers/check_lifecycle.py defaults
      - name: Exercise all browser checks against PostgreSQL containers
        run: |
          docker compose up -d
          python -m pytest tests/browser -q --junitxml=test-results/container-browser.xml
      - name: Capture immutable evidence before restart
        run: python tests/containers/check_lifecycle.py capture
      - name: Restart PostgreSQL and re-run migrations and seed
        run: |
          docker compose restart db
          docker compose run --rm migrate
          docker compose restart api web
          python tests/containers/check_lifecycle.py verify
      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p test-results
          docker compose ps -a > test-results/compose-status.txt
          docker compose logs --no-color > test-results/compose.log 2>&1
      - name: Retain synthetic-only container evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-check-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Remove only the disposable CI test stack
        if: always()
        run: docker compose -p aegisrisk-container-ci down --volumes --remove-orphans
